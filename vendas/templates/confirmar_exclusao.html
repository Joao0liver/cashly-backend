<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎓 Área do Aluno</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 500px;">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h1 class="h5 mb-0">⚠️ Confirmar Exclusão</h1>
            </div>
            <div class="card-body">
                <p class="mb-1">Você tem certeza que deseja excluir o aluno:</p>
                <p class="fw-bold fs-5 text-dark">{{ aluno.nome }}</p>
                <p class="text-muted small mb-2">Curso: {{ aluno.curso }}</p>
                <p class="text-danger small mb-3">Esta ação não pode ser desfeita!</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">🗑️ Sim, excluir</button>
                        <a href="{% url 'listar_alunos' %}" class="btn btn-secondary">← Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
