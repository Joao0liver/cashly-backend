<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎓 Área do Aluno</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 600px;">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h1 class="h5 mb-0">{{ titulo }}</h1>
            </div>
            <div class="card-body">

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Data</label>
                        <input type="date" name="data" class="form-control"
                               value="{{ venda.data|date:'Y-m-d' }}"
                               placeholder="" required>
                    </div>

                    <div class="mb-3">
                        <select name="tipo_pagamento" class="form-select" required>

                            <option value="">
                                Tipo de Pagamento
                            </option>

                            <option
                                value="DINHEIRO"
                                {% if venda.tipo_pagamento == 'DINHEIRO' %}selected{% endif %}
                            >
                                Dinheiro
                            </option>

                            <option
                                value="PIX"
                                {% if venda.tipo_pagamento == 'PIX' %}selected{% endif %}
                            >
                                Pix
                            </option>

                            <option
                                value="DEBITO"
                                {% if venda.tipo_pagamento == 'DEBITO' %}selected{% endif %}
                            >
                                Débito
                            </option>

                            <option
                                value="CREDITO"
                                {% if venda.tipo_pagamento == 'CREDITO' %}selected{% endif %}
                            >
                                Crédito
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Valor do Fechamento</label>
                        <input type="number" name="valor_total" class="form-control"
                               value="{{ venda.valor_total|default:'' }}"
                               step="0.01" min="0"
                               placeholder="0,00" required>
                    </div>

                    <div class="mb-3">
                        <label for="bandeira_cartao" class="form-label fw-semibold">
                            Bandeira do Cartão
                        </label>

                        <select name="bandeira_cartao" class="form-select">

                            <option value="">
                                Não se aplica!
                            </option>

                            <option
                                value="VISA"
                                {% if venda.bandeira_cartao == 'VISA' %}selected{% endif %}
                            >
                                Visa
                            </option>

                            <option
                                value="MASTERCARD"
                                {% if venda.bandeira_cartao == 'MASTERCARD' %}selected{% endif %}
                            >
                                Mastercard
                            </option>

                            <option
                                value="ELO"
                                {% if venda.bandeira_cartao == 'ELO' %}selected{% endif %}
                            >
                                Elo
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Responsável</label>
                        <input type="text" name="responsavel" class="form-control"
                               value="{{ venda.responsavel|default:'' }}"
                               placeholder="Responsável" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Número do Caixa</label>
                        <input type="text" name="num_caixa" class="form-control"
                               value="{{ venda.num_caixa|default:'' }}"
                               placeholder="Ex.: Caixa 01">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Observação</label>
                        <textarea name="obs" class="form-control" rows="3"
                                  placeholder="Escreva uma observação...">{{ venda.obs|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">

                            <input type="checkbox" name="conferido" class="form-check-input" {% if venda.conferido %}checked{% endif %}>

                            <label for="conferido" class="form-check-label fw-semibold">
                                Venda conferida
                            </label>

                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">💾 Salvar</button>
                        <a href="{% url 'listar_vendas' %}" class="btn btn-secondary">← Voltar</a>
                    </div>
                </form>

            </div>
        </div>

    </main>

</body>
</html>
