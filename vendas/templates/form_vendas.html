<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎓 Área do Aluno</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 600px;">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h1 class="h5 mb-0">{{ titulo }}</h1>
            </div>
            <div class="card-body">

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Data</label>
                        <!--
                            name="nome" → deve ser igual ao que usamos em request.POST['nome'] na view
                            value="..." → se for edição, o campo já vem preenchido com o valor atual
                        -->
                        <input type="date" name="data" class="form-control"
                               value="{{ vendas.data|default:'' }}"
                               placeholder="" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tipo de Pagamento</label>
                        <input type="text" name="tipo_pagamento" class="form-control"
                               value="{{ vendas.tipo_pagamento|default:'' }}"
                               placeholder="Tipo de Pagamento" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Valor do Fechamento</label>
                        <input type="number" name="valor_total" class="form-control"
                               value="{{ vendas.valor_total|default:'' }}"
                               placeholder="" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Bandeira do Cartão</label>
                        <input type="text" name="bandeira_cartao" class="form-control"
                               value="{{ vendas.bandeira_cartao|default:'' }}"
                               placeholder="Bandeira do Cartão" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Responsável</label>
                        <input type="text" name="responsavel" class="form-control"
                               value="{{ vendas.responsavel|default:'' }}"
                               placeholder="Responsável" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Número do Caixa</label>
                        <input type="text" name="num_caixa" class="form-control"
                               value="{{ vendas.num_caixa|default:'' }}"
                               placeholder="Número do Caixa" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Observação</label>
                        <textarea name="obs" class="form-control" rows="3"
                                  placeholder="Escreva uma observação...">{{ vendas.obs|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Conferido</label>
                        <input type="" name="conferido" class="form-control"
                               value="{{ vendas.conferido|default:'' }}"
                               placeholder="Conferido" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">💾 Salvar</button>
                        <a href="{% url 'listar_vendas' %}" class="btn btn-secondary">← Voltar</a>
                    </div>
                </form>

            </div>
        </div>

    </main>

</body>
</html>
